<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kalkulator Bangunan Pro Nusantara Group untuk menghitung kebutuhan material bangunan dengan cepat dan praktis.">
  <title>Kalkulator Bangunan Pro — Nusantara Group</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { 50:'#eef2ff', 100:'#e0e7ff', 500:'#6366f1', 600:'#4f46e5', 700:'#4338ca' } },
          boxShadow: { soft:'0 20px 60px rgba(15,23,42,.10)' }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html { scroll-behavior:smooth; }
    body { font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .glass { backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
    .tab-panel { display:none; animation:fade .22s ease-out; }
    .tab-panel.active { display:block; }
    @keyframes fade { from {opacity:0; transform:translateY(6px)} to {opacity:1; transform:translateY(0)} }
    input,select { outline:none; }
    input:focus,select:focus { box-shadow:0 0 0 4px rgba(99,102,241,.12); }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900 dark:bg-slate-950 dark:text-slate-100">
  <main class="min-h-screen px-4 py-5 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-6xl overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-soft dark:border-slate-800 dark:bg-slate-900">
      <header class="border-b border-slate-200 bg-white/95 px-5 py-5 glass dark:border-slate-800 dark:bg-slate-900/95 sm:px-8">
        <div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
          <div class="flex items-center gap-3">
            <div class="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-200 dark:shadow-none">
              <i data-lucide="calculator" class="h-5 w-5"></i>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <h1 class="text-lg font-extrabold tracking-tight sm:text-xl">Kalkulator Bangunan Pro</h1>
                <span class="rounded-full bg-indigo-50 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-indigo-600 dark:bg-indigo-950 dark:text-indigo-300">PRO</span>
              </div>
              <p class="mt-0.5 text-xs text-slate-500 dark:text-slate-400">Hitung kebutuhan material dengan cepat & praktis.</p>
            </div>
          </div>
          <button id="themeBtn" type="button" onclick="toggleTheme()" class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:border-indigo-300 hover:bg-indigo-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:border-indigo-700 dark:hover:bg-indigo-950">
            <i id="themeIcon" data-lucide="moon" class="h-4 w-4"></i><span id="themeText">Mode Gelap</span>
          </button>
        </div>
      </header>

      <div class="grid lg:grid-cols-[250px_1fr]">
        <aside class="border-b border-slate-200 bg-slate-50/80 p-4 dark:border-slate-800 dark:bg-slate-950/40 lg:border-b-0 lg:border-r lg:p-5">
          <div class="mb-3 px-2 text-[10px] font-bold uppercase tracking-[.16em] text-slate-400">Kalkulator</div>
          <nav class="space-y-1.5" aria-label="Jenis kalkulator">
            <button class="tab-btn active flex w-full items-center gap-3 rounded-xl border border-indigo-100 bg-white px-3.5 py-3 text-left text-sm font-bold text-indigo-600 shadow-sm transition dark:border-indigo-900 dark:bg-slate-900 dark:text-indigo-400" onclick="switchTab('hebel-panel',this)"><i data-lucide="blocks" class="h-4 w-4"></i><span>Hebel / Bata Ringan</span></button>
            <button class="tab-btn flex w-full items-center gap-3 rounded-xl border border-transparent px-3.5 py-3 text-left text-sm font-semibold text-slate-500 transition hover:bg-white hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-900 dark:hover:text-white" onclick="switchTab('keramik-panel',this)"><i data-lucide="grid-2x2" class="h-4 w-4"></i><span>Keramik</span></button>
            <button class="tab-btn flex w-full items-center gap-3 rounded-xl border border-transparent px-3.5 py-3 text-left text-sm font-semibold text-slate-500 transition hover:bg-white hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-900 dark:hover:text-white" onclick="switchTab('pajak-panel',this)"><i data-lucide="receipt" class="h-4 w-4"></i><span>DPP & PPN 12%</span></button>
          </nav>
          <div class="mt-6 rounded-2xl border border-indigo-100 bg-indigo-50 p-4 dark:border-indigo-900/60 dark:bg-indigo-950/30">
            <div class="mb-2 flex items-center gap-2 text-xs font-bold text-indigo-700 dark:text-indigo-300"><i data-lucide="lightbulb" class="h-4 w-4"></i> Tips</div>
            <p class="text-xs leading-5 text-indigo-700/80 dark:text-indigo-300/80">Masukkan ukuran dan jumlah secara teliti agar hasil estimasi lebih akurat.</p>
          </div>
        </aside>

        <section class="min-w-0 p-5 sm:p-8">
          <div id="hebel-panel" class="tab-panel active">
            <PanelTitle icon="blocks" title="Kebutuhan Hebel" subtitle="Estimasi jumlah bata ringan berdasarkan volume dinding." />
            <div class="grid gap-4 sm:grid-cols-2">
              <Field label="Ukuran Hebel" icon="ruler">
                <select id="ukuran" onchange="hitungHebel()" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800 transition dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
                  <option value="83">10 cm · 60×20×10 · ±83 pcs/m³</option><option value="112">7,5 cm · 60×20×7,5 · ±112 pcs/m³</option>
                </select>
              </Field>
              <Field label="Panjang Dinding" icon="move-horizontal"><Input id="panjang" suffix="m" oninput="hitungHebel()" placeholder="0" /></Field>
              <Field label="Tinggi Dinding" icon="move-vertical"><Input id="tinggi" suffix="m" oninput="hitungHebel()" placeholder="0" /></Field>
              <Field label="Cadangan Material" icon="percent"><Input id="cadangan" suffix="%" value="5" oninput="hitungHebel()" /></Field>
            </div>
            <Result id="hasilHebel" title="Estimasi kebutuhan" />
          </div>

          <div id="keramik-panel" class="tab-panel">
            <PanelTitle icon="grid-2x2" title="Kebutuhan Keramik" subtitle="Hitung kebutuhan dus berdasarkan luas area dan ukuran keramik." />
            <div class="grid gap-4 sm:grid-cols-2">
              <Field label="Panjang Ruangan" icon="move-horizontal"><Input id="kp" suffix="m" oninput="hitungKeramik()" placeholder="0" /></Field>
              <Field label="Lebar Ruangan" icon="move-vertical"><Input id="kl" suffix="m" oninput="hitungKeramik()" placeholder="0" /></Field>
              <Field label="Ukuran Keramik" icon="square"><select id="ukuranKeramik" onchange="hitungKeramik()" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold dark:border-slate-700 dark:bg-slate-800"><option value="0.36">30×30 cm</option><option value="0.36">40×40 cm</option><option value="0.36">60×60 cm</option></select></Field>
              <Field label="Isi per Dus" icon="package"><Input id="isiDus" suffix="pcs" value="4" oninput="hitungKeramik()" /></Field>
              <Field label="Cadangan" icon="percent"><Input id="cadanganKeramik" suffix="%" value="10" oninput="hitungKeramik()" /></Field>
            </div>
            <Result id="hasilKeramik" title="Estimasi kebutuhan" />
          </div>

          <div id="pajak-panel" class="tab-panel">
            <PanelTitle icon="receipt" title="DPP & PPN 12%" subtitle="Hitung nilai sebelum pajak, PPN, dan total transaksi." />
            <Field label="Harga termasuk PPN" icon="banknote"><Input id="hargaPajak" prefix="Rp" oninput="hitungPajak()" placeholder="0" /></Field>
            <Result id="hasilPajak" title="Ringkasan transaksi" />
          </div>

          <footer class="mt-8 border-t border-dashed border-slate-200 pt-5 text-center text-xs text-slate-400 dark:border-slate-800">
            <span class="font-semibold text-indigo-500">Nusantara Group</span> · Kalkulator Bangunan Pro
          </footer>
        </section>
      </div>
    </div>
  </main>

<script>
  function PanelTitle({icon,title,subtitle}) { return `<div class="mb-7"><div class="flex items-center gap-2"><i data-lucide="${icon}" class="h-5 w-5 text-indigo-500"></i><h2 class="text-xl font-extrabold tracking-tight">${title}</h2></div><p class="mt-1 text-sm text-slate-500 dark:text-slate-400">${subtitle}</p></div>`; }
  function Field({label,icon,children}) { return `<div class="form-field"><label class="mb-2 flex items-center gap-2 text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400"><i data-lucide="${icon}" class="h-3.5 w-3.5"></i>${label}</label>${children}</div>`; }
  function Input({id,suffix,prefix,value,oninput,placeholder}) { return `<div class="relative"><input id="${id}" type="number" min="0" step="any" ${value!==undefined?`value="${value}"`:''} ${oninput?`oninput="${oninput}"`:''} placeholder="${placeholder||''}" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800 transition placeholder:text-slate-300 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:placeholder:text-slate-600 ${prefix?'pl-11':''} ${suffix?'pr-12':''}">${prefix?`<span class="absolute left-4 top-1/2 -translate-y-1/2 text-sm font-bold text-slate-400">${prefix}</span>`:''}${suffix?`<span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">${suffix}</span>`:''}</div>`; }
  function Result(id,title) { return `<div id="${id}" class="mt-6 rounded-2xl border border-slate-200 bg-slate-50/80 p-5 dark:border-slate-700 dark:bg-slate-950/40"><div class="mb-3 flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-slate-400"><i data-lucide="bar-chart-3" class="h-4 w-4"></i>${title}</div><div class="result-body space-y-1"></div></div>`; }
  function rupiah(n){ return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number.isFinite(n)?n:0); }
  function num(id){ const v=parseFloat(document.getElementById(id)?.value); return Number.isFinite(v)?v:0; }
  function row(label,value,highlight=false){ return `<div class="flex items-center justify-between gap-4 border-b border-slate-200/80 py-3 last:border-0 dark:border-slate-800"><span class="text-sm text-slate-500 dark:text-slate-400">${label}</span><strong class="text-sm ${highlight?'text-indigo-600 dark:text-indigo-400 text-base':'text-slate-800 dark:text-slate-100'}">${value}</strong></div>`; }
  function render(id,html){ document.querySelector('#'+id+' .result-body').innerHTML=html; }
  function hitungHebel(){ const p=num('panjang'),t=num('tinggi'),pcs=num('ukuran'),cad=num('cadangan'); const luas=p*t, volume=luas*0.1, kebutuhan=Math.ceil(volume*pcs*(1+cad/100)); render('hasilHebel',row('Luas dinding',luas.toFixed(2)+' m²')+row('Volume estimasi',volume.toFixed(3)+' m³')+row('Kebutuhan + cadangan',kebutuhan.toLocaleString('id-ID')+' pcs',true)); }
  function hitungKeramik(){ const luas=num('kp')*num('kl'),cad=num('cadanganKeramik'),dus=Math.ceil((luas*(1+cad/100))/num('ukuranKeramik')/num('isiDus')); render('hasilKeramik',row('Luas area',luas.toFixed(2)+' m²')+row('Cadangan',cad+'%')+row('Estimasi kebutuhan',dus.toLocaleString('id-ID')+' dus',true)); }
  function hitungPajak(){ const total=num('hargaPajak'),dpp=total/1.12,ppn=total-dpp; render('hasilPajak',row('DPP',rupiah(dpp))+row('PPN 12%',rupiah(ppn))+row('Total termasuk PPN',rupiah(total),true)); }
  function switchTab(id,btn){ document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.tab-btn').forEach(x=>x.className='tab-btn flex w-full items-center gap-3 rounded-xl border border-transparent px-3.5 py-3 text-left text-sm font-semibold text-slate-500 transition hover:bg-white hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-900 dark:hover:text-white'); btn.className='tab-btn active flex w-full items-center gap-3 rounded-xl border border-indigo-100 bg-white px-3.5 py-3 text-left text-sm font-bold text-indigo-600 shadow-sm transition dark:border-indigo-900 dark:bg-slate-900 dark:text-indigo-400'; lucide.createIcons(); }
  function toggleTheme(){ const dark=document.documentElement.classList.toggle('dark'); localStorage.setItem('theme',dark?'dark':'light'); document.getElementById('themeText').textContent=dark?'Mode Terang':'Mode Gelap'; document.getElementById('themeIcon').setAttribute('data-lucide',dark?'sun':'moon'); lucide.createIcons(); }
  function initTheme(){ if(localStorage.getItem('theme')==='dark') document.documentElement.classList.add('dark'); document.getElementById('themeText').textContent=document.documentElement.classList.contains('dark')?'Mode Terang':'Mode Gelap'; }
  initTheme();
  document.querySelector('section').innerHTML=document.querySelector('section').innerHTML.replace(/<PanelTitle[^>]*\/>/g,'');
  // Re-insert dynamic panel headings after the lightweight component markup is rendered.
  document.querySelector('#hebel-panel').insertAdjacentHTML('afterbegin',PanelTitle({icon:'blocks',title:'Kebutuhan Hebel',subtitle:'Estimasi jumlah bata ringan berdasarkan volume dinding.'}));
  document.querySelector('#keramik-panel').insertAdjacentHTML('afterbegin',PanelTitle({icon:'grid-2x2',title:'Kebutuhan Keramik',subtitle:'Hitung kebutuhan dus berdasarkan luas area dan ukuran keramik.'}));
  document.querySelector('#pajak-panel').insertAdjacentHTML('afterbegin',PanelTitle({icon:'receipt',title:'DPP & PPN 12%',subtitle:'Hitung nilai sebelum pajak, PPN, dan total transaksi.'}));
  lucide.createIcons(); hitungHebel(); hitungKeramik(); hitungPajak();
</script>
</body>
</html>
