<!doctype html>
<html lang="id" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Nusantara Group Calculator Hub.">
<title>Kalkulator Bangunan Pro — Nusantara Group</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'};</script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.glass{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.nav-active{background:#eef2ff;color:#4f46e5;border-color:#c7d2fe}.dark .nav-active{background:#1e1b4b;color:#a5b4fc;border-color:#3730a3}iframe{border:0}
</style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
<div class="flex min-h-screen">
<aside id="sidebar" class="fixed inset-y-0 left-0 z-50 flex w-72 -translate-x-full flex-col border-r border-slate-200 bg-white/95 p-4 shadow-xl transition-transform duration-300 glass dark:border-slate-800 dark:bg-slate-900/95 lg:static lg:translate-x-0 lg:shadow-none">
<div class="mb-6 flex items-center justify-between px-2">
<div class="flex items-center gap-3"><div class="grid h-10 w-10 place-items-center rounded-xl bg-indigo-600 text-white"><i data-lucide="calculator"></i></div><div><div class="font-extrabold">Nusantara</div><div class="text-[10px] font-bold uppercase tracking-widest text-indigo-500">Calculator Pro</div></div></div>
<button onclick="toggleSidebar()" class="rounded-lg p-2 hover:bg-slate-100 dark:hover:bg-slate-800 lg:hidden"><i data-lucide="x" class="h-5 w-5"></i></button>
</div>
<div class="mb-3 px-2 text-[10px] font-bold uppercase tracking-[.16em] text-slate-400">Menu Utama</div>
<nav class="space-y-1.5">
<button onclick="loadPage('dpp-ppn/index.html',this,'DPP & PPN 12%')" class="nav-btn nav-active flex w-full items-center gap-3 rounded-xl border px-3.5 py-3 text-left text-sm font-bold"><i data-lucide="receipt" class="h-4 w-4"></i>DPP & PPN 12%</button>
<button onclick="loadPage('index.html',this,'Kalkulator Bangunan')" class="nav-btn flex w-full items-center gap-3 rounded-xl border border-transparent px-3.5 py-3 text-left text-sm font-semibold text-slate-500 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-800"><i data-lucide="layout-dashboard" class="h-4 w-4"></i>Kalkulator Bangunan</button>
</nav>
<div class="mt-auto rounded-2xl border border-indigo-100 bg-indigo-50 p-4 dark:border-indigo-900/60 dark:bg-indigo-950/30"><div class="mb-1 flex items-center gap-2 text-xs font-bold text-indigo-700 dark:text-indigo-300"><i data-lucide="sparkles" class="h-4 w-4"></i>Nusantara Group</div><p class="text-xs leading-5 text-indigo-700/80 dark:text-indigo-300/80">Sistem kalkulator modular. Menu baru dapat ditambahkan kapan saja.</p></div>
</aside>
<div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 z-40 hidden bg-slate-950/40 lg:hidden"></div>
<div class="flex min-w-0 flex-1 flex-col">
<header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-slate-200 bg-white/90 px-4 shadow-sm glass dark:border-slate-800 dark:bg-slate-900/90 sm:px-6">
<div class="flex min-w-0 items-center gap-3"><button onclick="toggleSidebar()" class="rounded-xl border border-slate-200 p-2 hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800 lg:hidden"><i data-lucide="menu" class="h-5 w-5"></i></button><div><div id="pageTitle" class="truncate text-sm font-extrabold sm:text-base">DPP & PPN 12%</div><div class="hidden text-[11px] text-slate-400 sm:block">Nusantara Group · Calculator Hub</div></div></div>
<button onclick="toggleTheme()" class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-semibold dark:border-slate-700 dark:bg-slate-800"><i id="themeIcon" data-lucide="moon" class="h-4 w-4"></i><span id="themeText" class="hidden sm:inline">Mode Gelap</span></button>
</header>
<main class="min-h-0 flex-1 bg-slate-100 p-3 dark:bg-slate-950 sm:p-5">
<div class="h-[calc(100vh-6.5rem)] min-h-[650px] overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900">
<iframe id="mainFrame" src="dpp-ppn/index.html" title="DPP & PPN 12%" class="h-full w-full"></iframe>
</div>
</main>
</div>
</div>
<script>
function loadPage(url,btn,title){document.getElementById('mainFrame').src=url;document.getElementById('mainFrame').title=title;document.getElementById('pageTitle').textContent=title;document.querySelectorAll('.nav-btn').forEach(b=>b.className='nav-btn flex w-full items-center gap-3 rounded-xl border border-transparent px-3.5 py-3 text-left text-sm font-semibold text-slate-500 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-800');btn.className='nav-btn nav-active flex w-full items-center gap-3 rounded-xl border px-3.5 py-3 text-left text-sm font-bold';lucide.createIcons();if(window.innerWidth<1024)toggleSidebar(false)}
function toggleSidebar(force){const s=document.getElementById('sidebar'),o=document.getElementById('overlay');const open=force===undefined?!s.classList.contains('translate-x-0'):force;s.classList.toggle('translate-x-0',open);s.classList.toggle('-translate-x-full',!open);o.classList.toggle('hidden',!open)}
function toggleTheme(){const dark=document.documentElement.classList.toggle('dark');localStorage.setItem('theme',dark?'dark':'light');document.getElementById('themeText').textContent=dark?'Mode Terang':'Mode Gelap';document.getElementById('themeIcon').setAttribute('data-lucide',dark?'sun':'moon');lucide.createIcons()}
function init(){if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');document.getElementById('themeText').textContent=document.documentElement.classList.contains('dark')?'Mode Terang':'Mode Gelap';lucide.createIcons()}
init();
</script>
</body>
</html>
