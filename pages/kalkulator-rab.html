<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAB Sederhana — Nusantara Group</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'};</script><script src="https://unpkg.com/lucide@latest"></script></head><body class="min-h-screen bg-slate-100 dark:bg-slate-950"><main class="min-h-screen p-3 sm:p-6"><div class="mx-auto max-w-3xl rounded-3xl border border-slate-200 bg-white p-5 shadow-xl dark:border-slate-800 dark:bg-slate-900"><div class="mb-6"><h1 class="text-xl font-extrabold">RAB Sederhana</h1><p class="mt-1 text-sm text-slate-500">Hitung subtotal pekerjaan/material dan biaya tambahan.</p></div><div class="grid gap-4 sm:grid-cols-2"><label class="text-sm font-semibold">Harga Satuan<input id="price" type="number"  class="input mt-2 w-full" oninput="calc()"></label><label class="text-sm font-semibold">Volume / Qty<input id="qty" type="number"  class="input mt-2 w-full" oninput="calc()"></label><label class="text-sm font-semibold">Biaya Tambahan (%)<input id="extra" type="number" value="0" class="input mt-2 w-full" oninput="calc()"></label></div><div id="result" class="mt-6"></div></div></main><script src="../js/app.js"></script><script src="../js/tools.js"></script><script>initTheme();calc();</script></body></html>
