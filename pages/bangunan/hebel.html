<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Kalkulator kebutuhan Hebel Nusantara Group."><title>Kalkulator Hebel — Nusantara Group</title><link rel="stylesheet" href="../../css/style.css"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'};</script><script src="https://unpkg.com/lucide@latest"></script></head><body class="min-h-screen bg-slate-100 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100"><main class="min-h-screen px-3 py-6 sm:px-6 lg:px-8"><div class="mx-auto max-w-5xl overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-[0_20px_60px_rgba(15,23,42,.10)] dark:border-slate-800 dark:bg-slate-900"><header class="border-b border-slate-200 px-5 py-6 sm:px-8 dark:border-slate-800"><div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"><div class="flex items-center gap-3"><div class="grid h-12 w-12 place-items-center rounded-2xl bg-indigo-600 text-white"><i data-lucide="blocks" class="h-6 w-6"></i></div><div><h1 class="text-lg font-extrabold sm:text-xl">Kalkulator Hebel / Bata Ringan</h1><p class="text-xs text-slate-500 dark:text-slate-400">Estimasi kebutuhan bata ringan berdasarkan luas dinding.</p></div></div><button onclick="toggleTheme()" class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm font-semibold dark:border-slate-700 dark:bg-slate-800"><i id="themeIcon" data-lucide="moon" class="h-4 w-4"></i><span id="themeText">Mode Gelap</span></button></div></header><section class="p-5 sm:p-8"><div class="grid gap-4 sm:grid-cols-2"><div><label class="mb-2 block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">Ukuran Hebel</label><select id="ukuran" class="input w-full" onchange="hitungHebel()"><option value="83">Hebel 10 cm · 60×20×10 · ±83 pcs/m³</option><option value="112">Hebel 7,5 cm · 60×20×7,5 · ±112 pcs/m³</option><option value="83">Bata ringan 10 cm · ±83 pcs/m³</option></select></div><div><label class="mb-2 block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">Panjang Dinding</label><div class="relative"><input id="panjang" type="number" min="0" step="any" placeholder="0" class="input w-full pr-10" oninput="hitungHebel()"><span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-slate-400">m</span></div></div><div><label class="mb-2 block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">Tinggi Dinding</label><div class="relative"><input id="tinggi" type="number" min="0" step="any" placeholder="0" class="input w-full pr-10" oninput="hitungHebel()"><span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-slate-400">m</span></div></div><div><label class="mb-2 block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">Cadangan Material</label><div class="relative"><input id="cadangan" type="number" min="0" value="5" class="input w-full pr-12" oninput="hitungHebel()"><span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-slate-400">%</span></div></div></div><div class="mt-6 rounded-2xl border border-slate-200 bg-slate-50/80 p-5 dark:border-slate-700 dark:bg-slate-950/40"><div class="mb-3 flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-slate-400"><i data-lucide="bar-chart-3" class="h-4 w-4"></i>Estimasi Kebutuhan</div><div id="hasilHebel"></div></div></section></div></main><script src="../../js/app.js"></script><script src="../../js/hebel.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{initTheme();lucide.createIcons();hitungHebel();});</script></body></html>
