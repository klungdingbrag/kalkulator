<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Kalkulator kebutuhan keramik Nusantara Group."><title>Kalkulator Keramik — Nusantara Group</title><link rel="stylesheet" href="../../css/style.css"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'};</script><script src="https://unpkg.com/lucide@latest"></script></head><body class="min-h-screen bg-slate-100 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100"><main class="min-h-screen px-3 py-6 sm:px-6 lg:px-8"><div class="mx-auto max-w-5xl overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-[0_20px_60px_rgba(15,23,42,.10)] dark:border-slate-800 dark:bg-slate-900"><header class="border-b border-slate-200 px-5 py-6 sm:px-8 dark:border-slate-800"><div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"><div class="flex items-center gap-3"><div class="grid h-12 w-12 place-items-center rounded-2xl bg-indigo-600 text-white"><i data-lucide="grid-2x2" class="h-6 w-6"></i></div><div><h1 class="text-lg font-extrabold sm:text-xl">Kalkulator Keramik</h1><p class="text-xs text-slate-500 dark:text-slate-400">Hitung kebutuhan keramik berdasarkan luas area.</p></div></div><button onclick="toggleTheme()" class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm font-semibold dark:border-slate-700 dark:bg-slate-800"><i id="themeIcon" data-lucide="moon" class="h-4 w-4"></i><span id="themeText">Mode Gelap</span></button></div></header><section class="p-5 sm:p-8"><div class="grid gap-4 sm:grid-cols-2"><div><label class="mb-2 block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">Panjang Ruangan</label><div class="relative"><input id="kp" type="number" min="0" step="any" placeholder="0" class="input w-full pr-10" oninput="hitungKeramik()"><span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-slate-400">m</span></div></div><div><label class="mb-2 block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">Lebar Ruangan</label><div class="relative"><input id="kl" type="number" min="0" step="any" placeholder="0" class="input w-full pr-10" oninput="hitungKeramik()"><span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-slate-400">m</span></div></div><div><label class="mb-2 block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">Ukuran Keramik</label><select id="luasKeping" class="input w-full" onchange="hitungKeramik()"><option value="0.36">60×60 cm · 0,36 m²</option><option value="0.25">50×50 cm · 0,25 m²</option><option value="0.16">40×40 cm · 0,16 m²</option><option value="0.09">30×30 cm · 0,09 m²</option></select></div><div><label class="mb-2 block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">Isi per Dus</label><div class="relative"><input id="isiDus" type="number" min="1" value="4" class="input w-full pr-12" oninput="hitungKeramik()"><span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-slate-400">pcs</span></div></div><div><label class="mb-2 block text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">Cadangan</label><div class="relative"><input id="cadanganKeramik" type="number" min="0" value="10" class="input w-full pr-12" oninput="hitungKeramik()"><span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-slate-400">%</span></div></div></div><div class="mt-6 rounded-2xl border border-slate-200 bg-slate-50/80 p-5 dark:border-slate-700 dark:bg-slate-950/40"><div class="mb-3 flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-slate-400"><i data-lucide="bar-chart-3" class="h-4 w-4"></i>Estimasi Kebutuhan</div><div id="hasilKeramik"></div></div></section></div></main><script src="../../js/app.js"></script><script src="../../js/keramik.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{initTheme();lucide.createIcons();hitungKeramik();});</script></body></html>
