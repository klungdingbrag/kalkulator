<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Konversi satuan panjang mm, cm, m, dan km."><title>Konversi Satuan — Nusantara Group</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'};</script><script src="https://unpkg.com/lucide@latest"></script></head><body class="min-h-screen bg-slate-100 dark:bg-slate-950"><main class="min-h-screen p-3 sm:p-6"><div class="mx-auto max-w-3xl rounded-3xl border border-slate-200 bg-white p-5 shadow-xl dark:border-slate-800 dark:bg-slate-900"><div class="mb-6 flex items-start justify-between gap-4"><div><h1 class="text-xl font-extrabold">Konversi Satuan</h1><p class="mt-1 text-sm text-slate-500">Konversi satuan panjang mm, cm, m, dan km.</p></div><button onclick="toggleTheme()" class="rounded-xl border border-slate-200 p-2 dark:border-slate-700"><i id="themeIcon" data-lucide="moon" class="h-4 w-4"></i></button></div><div class="grid gap-4 sm:grid-cols-2"><label class="text-sm font-semibold">Nilai<input id="v" type="number"  class="input mt-2 w-full" oninput="calc()"></label><label class="text-sm font-semibold">Satuan<select id="unit" class="input mt-2 w-full" onchange="calc()"><option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="km">km</option></select></label></div><div id="result" class="mt-6"></div></div></main><script src="../js/app.js"></script><script src="../js/tools.js"></script><script>initTheme();lucide.createIcons();calc();</script></body></html>
