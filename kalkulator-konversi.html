<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalkulator Konversi Satuan</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'};</script><script src="https://unpkg.com/lucide@latest"></script></head><body class="min-h-screen bg-slate-100 dark:bg-slate-950"><main class="min-h-screen p-3 sm:p-6"><div class="mx-auto max-w-3xl rounded-3xl bg-white p-5 shadow-xl dark:bg-slate-900"><h1 class="text-xl font-extrabold">Konversi Satuan</h1><p class="mb-6 text-sm text-slate-500">Panjang: mm, cm, m, km.</p><div class="grid gap-4 sm:grid-cols-2"><label class="text-sm font-semibold">Nilai<input id="v" type="number" class="input mt-2 w-full" oninput="calc()"></label><label class="text-sm font-semibold">Satuan<select id="unit" class="input mt-2 w-full" onchange="calc()"><option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="km">km</option></select></label></div><div id="result" class="mt-5"></div></div></main><script src="../js/app.js"></script><script src="../js/tools.js"></script><script>initTheme();calc();</script></body></html>
