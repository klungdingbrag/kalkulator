<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalkulator Persentase</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'};</script><script src="https://unpkg.com/lucide@latest"></script></head><body class="min-h-screen bg-slate-100 dark:bg-slate-950"><main class="min-h-screen p-3 sm:p-6"><div class="mx-auto max-w-3xl rounded-3xl bg-white p-5 shadow-xl dark:bg-slate-900"><header class="mb-6"><h1 class="text-xl font-extrabold">Kalkulator Persentase</h1><p class="text-sm text-slate-500">Hitung persentase dari sebuah nilai.</p></header><div class="grid gap-4 sm:grid-cols-2"><label class="text-sm font-semibold">Nilai<input id="a" type="number" class="input mt-2 w-full" oninput="calc()"></label><label class="text-sm font-semibold">Persentase (%)<input id="b" type="number" class="input mt-2 w-full" oninput="calc()"></label></div><div id="result" class="mt-5 rounded-2xl bg-indigo-50 p-6 text-2xl font-extrabold text-indigo-700 dark:bg-indigo-950/30 dark:text-indigo-300">0</div></div></main><script src="../js/app.js"></script><script src="../js/tools.js"></script><script>initTheme();calc();</script></body></html>
