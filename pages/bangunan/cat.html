<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Estimasi liter cat berdasarkan luas, daya sebar, dan jumlah lapis."><title>Kebutuhan Cat — Nusantara Group</title><link rel="stylesheet" href="../../css/style.css"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'};</script><script src="https://unpkg.com/lucide@latest"></script></head><body class="min-h-screen bg-slate-100 dark:bg-slate-950"><main class="min-h-screen p-3 sm:p-6"><div class="mx-auto max-w-3xl rounded-3xl border border-slate-200 bg-white p-5 shadow-xl dark:border-slate-800 dark:bg-slate-900"><div class="mb-6 flex items-start justify-between gap-4"><div><h1 class="text-xl font-extrabold">Kebutuhan Cat</h1><p class="mt-1 text-sm text-slate-500">Estimasi liter cat berdasarkan luas, daya sebar, dan jumlah lapis.</p></div><button onclick="toggleTheme()" class="rounded-xl border border-slate-200 p-2 dark:border-slate-700"><i id="themeIcon" data-lucide="moon" class="h-4 w-4"></i></button></div><div class="grid gap-4 sm:grid-cols-2"><label class="text-sm font-semibold">Luas (m²)<input id="area" type="number"  class="input mt-2 w-full" oninput="calc()"></label><label class="text-sm font-semibold">Daya Sebar (m²/L)<input id="spread" type="number" value="10" class="input mt-2 w-full" oninput="calc()"></label><label class="text-sm font-semibold">Jumlah Lapis<input id="coat" type="number" value="2" class="input mt-2 w-full" oninput="calc()"></label><label class="text-sm font-semibold">Cadangan (%)<input id="reserve" type="number" value="10" class="input mt-2 w-full" oninput="calc()"></label></div><div id="result" class="mt-6"></div></div></main><script src="../../js/app.js"></script><script src="../../js/tools.js"></script><script>initTheme();lucide.createIcons();calc();</script></body></html>
