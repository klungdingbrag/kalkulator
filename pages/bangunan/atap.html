<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kebutuhan Atap — Nusantara Group</title><link rel="stylesheet" href="../../css/style.css"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'};</script><script src="https://unpkg.com/lucide@latest"></script></head><body class="min-h-screen bg-slate-100 dark:bg-slate-950"><main class="min-h-screen p-3 sm:p-6"><div class="mx-auto max-w-3xl rounded-3xl border border-slate-200 bg-white p-5 shadow-xl dark:border-slate-800 dark:bg-slate-900"><div class="mb-6"><h1 class="text-xl font-extrabold">Kebutuhan Atap</h1><p class="mt-1 text-sm text-slate-500">Estimasi lembar penutup atap berdasarkan luas.</p></div><div class="grid gap-4 sm:grid-cols-2"><div><label class="mb-2 block text-sm font-semibold">Jenis Penutup Atap</label><select id="jenisAtap" class="input w-full" onchange="document.getElementById('sheet').value=this.value;calc()"><option value="1.8">Genteng metal / lembar setara · 1,80 m²</option><option value="2.4">Spandek / lembar setara · 2,40 m²</option><option value="3">Atap fiber cement · 3,00 m²</option></select></div><label class="text-sm font-semibold">Panjang Atap (m)<input id="p" type="number"  class="input mt-2 w-full" oninput="calc()"></label><label class="text-sm font-semibold">Lebar Atap (m)<input id="l" type="number"  class="input mt-2 w-full" oninput="calc()"></label><label class="text-sm font-semibold">Luas per Lembar (m²)<input id="sheet" type="number" value="1.8" class="input mt-2 w-full" oninput="calc()"></label><label class="text-sm font-semibold">Cadangan (%)<input id="r" type="number" value="10" class="input mt-2 w-full" oninput="calc()"></label></div><div id="result" class="mt-6"></div></div></main><script src="../../js/app.js"></script><script src="../../js/tools.js"></script><script>initTheme();calc();</script></body></html>
