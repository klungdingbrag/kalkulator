<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Hitung omzet, HPP, profit kotor, dan margin."><title>Kalkulator Profit — Nusantara Calculator Pro</title><link rel="stylesheet" href="../../css/style.css"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'};</script><script src="https://unpkg.com/lucide@latest"></script></head><body class="min-h-screen bg-slate-100 dark:bg-slate-950"><main class="min-h-screen p-3 sm:p-6"><div class="mx-auto max-w-3xl rounded-3xl border border-emerald-200 bg-white p-5 shadow-xl dark:border-emerald-900 dark:bg-slate-900"><div class="mb-6"><span class="inline-flex rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1 text-xs font-bold text-emerald-700 dark:border-emerald-900 dark:bg-emerald-950/30 dark:text-emerald-300">BISNIS • PROFIT</span><h1 class="mt-3 text-xl font-extrabold">Kalkulator Profit</h1><p class="mt-1 text-sm text-slate-500">Gunakan harga jual bersih setelah diskon untuk melihat profit transaksi.</p></div><div class="grid gap-4 sm:grid-cols-2"><label class="text-sm font-semibold">Harga Jual Bersih / Unit (Rp)<input id="jual" type="number" class="input mt-2 w-full" placeholder="Contoh: 44.650" oninput="calc()"></label><label class="text-sm font-semibold">HPP / Unit (Rp)<input id="hpp" type="number" class="input mt-2 w-full" placeholder="Contoh: 37.700" oninput="calc()"></label><label class="text-sm font-semibold">Jumlah Terjual<input id="qty" type="number" class="input mt-2 w-full" placeholder="Contoh: 100" oninput="calc()"></label></div><div class="mt-4 rounded-xl bg-emerald-50 p-3 text-xs text-emerald-800 dark:bg-emerald-950/30 dark:text-emerald-200">Profit kotor = (Harga Jual Bersih − HPP) × jumlah terjual.</div><div id="result" class="mt-6"></div><div class="mt-5 flex flex-wrap gap-2"><a href="bep.html" class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-b
